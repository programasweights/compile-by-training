name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile compile.py
      - run: python compile.py --help > /dev/null
      - run: python compile.py --print-config | python -m json.tool > /dev/null
